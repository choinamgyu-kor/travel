<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 세계여행 노트</title>
<style>
:root{--bg:#f4f6f1;--card:#fff;--text:#1f2a1f;--mute:#667;--line:#dde3d6;--brand:#7cb342;--brand-d:#4f7a1e;--ok:#dcf59a;--warn:#ffe29a;--bad:#ffb3a8;--blue:#8ec9e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151a14;--card:#1f261e;--text:#e6ece2;--mute:#9aa596;--line:#364032;--brand:#7cb342;--brand-d:#a5d46a;--ok:#4a5a1f;--warn:#5c4a1a;--bad:#5e2b25;--blue:#1f4a63;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151a14;--card:#1f261e;--text:#e6ece2;--mute:#9aa596;--line:#364032;--brand:#7cb342;--brand-d:#a5d46a;--ok:#4a5a1f;--warn:#5c4a1a;--bad:#5e2b25;--blue:#1f4a63;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
header{background:var(--brand);color:#fff;padding:14px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{font-size:20px;margin:0;flex:1}
input,select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit}
main{max-width:1000px;margin:20px auto;padding:0 16px;display:grid;grid-template-columns:230px 1fr;gap:18px}
@media(max-width:720px){main{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;gap:6px}
.item{padding:10px 12px;border:1px solid var(--line);background:var(--card);border-radius:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.item.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.item small{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
h2{margin:0 0 12px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid var(--line);padding:9px 12px;text-align:left}
th{width:110px;background:var(--bg);font-weight:600}
.ok{background:var(--ok)}.warn{background:var(--warn)}.bad{background:var(--bad)}.blue{background:var(--blue)}
.map{width:100%;height:480px;border:1px solid var(--line);border-radius:10px;margin-top:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
a.btn{background:var(--brand);color:#fff;padding:9px 14px;border-radius:8px;text-decoration:none}
.note{margin-top:14px;color:var(--mute);font-size:14px}
</style>
</head>
<body>
<header>
  <h1>🌍 내 세계여행 노트</h1>
  <input id="q" placeholder="국가 검색…">
  <select id="sf"><option value="">안전등급 전체</option><option>1</option><option>2</option><option>3</option></select>
</header>
<main>
  <div class="list" id="list"></div>
  <div class="card" id="detail"></div>
</main>
<script>
// 여기 데이터만 고치면 나라를 추가·수정할 수 있습니다.
const C=[
{n:"베냉 Benin",cap:"Porto-Novo",safe:1,order:0,first:"0000-00-00",us:"eVisa",kr:"eVisa/Arrival Visa",cur:"(XOF) CFA Franc = 585",lang:"English",volt:"220 Volt / 50 Hz",drive:"우측 차선",q:"Benin"},
{n:"페루 Peru",cap:"Lima",safe:2,order:1,first:"2019-03-02",us:"무비자",kr:"무비자 (90일)",cur:"(PEN) Sol = 380",lang:"Spanish",volt:"220 Volt / 60 Hz",drive:"우측 차선",q:"Peru",map:"1fSJZY6-BR-Q5r6HgkMba1sIeK19eQMA&ehbc=2E312F"},
{n:"일본 Japan",cap:"Tokyo",safe:1,order:2,first:"2015-05-10",us:"무비자",kr:"무비자 (90일)",cur:"(JPY) Yen = 9.2",lang:"Japanese",volt:"100 Volt / 50·60 Hz",drive:"좌측 차선",q:"Japan"},
{n:"모로코 Morocco",cap:"Rabat",safe:2,order:3,first:"2022-11-20",us:"무비자",kr:"무비자 (90일)",cur:"(MAD) Dirham = 140",lang:"Arabic / French",volt:"220 Volt / 50 Hz",drive:"우측 차선",q:"Morocco"}
];
const lv={1:["(1) Normal","ok"],2:["(2) Caution","warn"],3:["(3) Warning","bad"]};
let sel=0;
const $=id=>document.getElementById(id);
function renderList(){
  const q=$("q").value.toLowerCase(),f=$("sf").value;
  const rows=C.map((c,i)=>({c,i})).filter(({c})=>c.n.toLowerCase().includes(q)&&(!f||String(c.safe)===f));
  $("list").innerHTML=rows.map(({c,i})=>`<div class="item ${i===sel?'on':''}" data-i="${i}"><span>${c.n}</span><small>${lv[c.safe][0].slice(0,3)}</small></div>`).join("")||"<small>결과 없음</small>";
}
function renderDetail(){
  const c=C[sel];
  $("detail").innerHTML=`<h2>${c.n}</h2><div class="tbl"><table>
  <tr><th>국가 안전</th><td class="${lv[c.safe][1]}">${lv[c.safe][0]}</td><th>수도</th><td>${c.cap}</td></tr>
  <tr><th>방문 순서</th><td>${c.order} 번째 국가</td><th>첫 입국일</th><td>${c.first}</td></tr>
  <tr><th>미국 여권</th><td class="blue">${c.us}</td><th>한국 여권</th><td class="blue">${c.kr}</td></tr>
  <tr><th>통화/환율</th><td>${c.cur}</td><th>공용어</th><td>${c.lang}</td></tr>
  <tr><th>외부 전원</th><td>${c.volt}</td><th>운전 방향</th><td>${c.drive}</td></tr></table></div>
  ${c.map?`<iframe class="map" src="https://www.google.com/maps/d/embed?mid=${c.map}" loading="lazy" allowfullscreen></iframe>`:""}
  <div class="btns">
   <a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.q)}">Google 지도에서 보기</a>
   <a class="btn" target="_blank" rel="noopener" href="https://www.0404.go.kr/">외교부 안전정보</a>
  </div>
  <p class="note">※ 위 데이터는 예시입니다. 코드 상단의 데이터 목록을 수정해 나라를 추가하세요.</p>`;
}
$("list").addEventListener("click",e=>{const t=e.target.closest(".item");if(t){sel=+t.dataset.i;renderList();renderDetail();}});
$("q").oninput=$("sf").onchange=renderList;
renderList();renderDetail();
</script>
</body>
</html>
